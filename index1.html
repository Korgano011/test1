<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Info</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    width:600px;
    margin:40px auto;


}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-weight:bold;
}
</style>

</head>
<body bgcolor = "#dfe6e9">

<h2>Customer Table Insert</h2>

<label>Name</label>
<input type="text" id="name">

<label>Address</label>
<input type="text" id="address">

<label>Phone</label>
<input type="tel"
id="phone"
name="phone"
placeholder="1234567890"
pattern ="[0-9]{3}[-.\s]?[0-9]{3}[-.\s]?[0-9]{4}"
required
>

<label>Email</label>
<input type="email"
id="email"
name = "email"
required
pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"
title="Please enter a valid email"

>

<label>Date</label>
<input type="date" id="date">

<label>Reason for Request</label>
<input type="text" id="explanation">

<button onclick="saveRecord()">Submit</button>

<div id="result"></div>

<script>

const API_URL =
"https://zex9c3vq53.execute-api.us-east-1.amazonaws.com/default/dynamoDiscount";

const phoneMaskInput = document.getElementById("phone");
phoneMaskInput.addEventListener("input", () => {
    const digits = phoneMaskInput.value.replace(/\D/g, "").slice(0, 10);
    if (digits.length > 6) {
        phoneMaskInput.value = digits.slice(0, 3) + "-" + digits.slice(3, 6) + "-" + digits.slice(6);
    } else if (digits.length > 3) {
        phoneMaskInput.value = digits.slice(0, 3) + "-" + digits.slice(3);
    } else {
        phoneMaskInput.value = digits;
    }
});

async function saveRecord(){

    const nameInput = document.getElementById("name");
    const addressInput = document.getElementById("address");
    const phoneInput = document.getElementById("phone");
    const emailInput = document.getElementById("email");
    const dateInput = document.getElementById("date");
    const explanationInput = document.getElementById("explanation");

const name = nameInput.value;
const address = addressInput.value;
const phone = phoneInput.value;
const email = emailInput.value;
const date = dateInput.value;
const explanation = explanationInput.value;

// check for valid email and phone number

if (!emailInput.checkValidity()) {
emailInput.reportValidity();
return;
}

if (!phoneInput.checkValidity()) {
phoneInput.reportValidity();
return;
}

let result;

try {

    const response = await fetch(API_URL,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            name,
            address,
	    phone,
	    email,
            date,
	    explanation
        })
    });

    result = await response.json();

} catch(err) {
    console.error(err);
    document.getElementById("result").textContent = err.message;
}

    document.getElementById("result").textContent =
        "Status: " + (result.Status || result.status || result.message || "Unknown");

// Clear the fields when submitted

if (result.Status === "Success" || result.status === "Success") {
document.getElementById("name").value = "";
document.getElementById("address").value = "";
document.getElementById("phone").value = "";
document.getElementById("email").value = "";
document.getElementById("date").value = "";
document.getElementById("explanation").value = "";

phone.focus();
email.focus();

}
}
</script>
